# ============================================================================
# Pane Tests — stdlib unittest suite for bin/pane
# ============================================================================
# Runs `python3 -m unittest discover -s bin/tests` from the repo root on 3.9
# (the floor: pub runs Debian 12) and 3.12.
#
# Path-filtered to bin/** to stay cheap, which per the hard rule in
# fleet-ops/required-checks.json means this must NOT be marked a required
# status check: a required check whose workflow never triggers on a given PR
# is held "Expected" forever, deadlocking that PR. Leave this one
# informational.
# ============================================================================

name: Pane Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'bin/**'
      - '.github/workflows/pane-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the test step runs PR-controlled code
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (Python ${{ matrix.python }})
        run: python3 -m unittest discover -s bin/tests -v
