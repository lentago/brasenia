# ============================================================================
# Family brief producer unit tests
# ============================================================================
# Runs the stdlib-only unit suite for producers/family-brief. The suite drives
# a fixture Family Brief document over file:// and temp directories, so it
# needs no tokens and no network.
#
# Path-filtered to producers/family-brief/** to stay cheap, so this must NOT
# be made a required status check: a required check whose workflow never triggers on
# a given PR is held "Expected" forever, deadlocking that PR. Leave it
# informational.
# ============================================================================

name: Family Brief Producer Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'producers/family-brief/**'
      - '.github/workflows/family-brief-producer-tests.yml'

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest is 26.04, where setup-python has no 3.9 build;
    # 3.9 (the floor) is built for 22.04 and 24.04 only.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor (pub runs Debian 12's 3.11); 3.12 is current.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (Python ${{ matrix.python }})
        working-directory: producers/family-brief
        run: python3 -m unittest discover -s tests
