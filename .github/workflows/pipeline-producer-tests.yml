# ============================================================================
# Pipeline producer unit tests
# ============================================================================
# Runs the stdlib-only unit suite for producers/pipeline (#36). The suite drives
# fixture pipeline.json documents over file:// and temp directories, so it needs no
# tokens and no network.
#
# Path-filtered to producers/pipeline/** to stay cheap, so this must NOT be made
# a required status check: a required check whose workflow never triggers on
# a given PR is held "Expected" forever, deadlocking that PR. Leave it
# informational.
# ============================================================================

name: Pipeline Producer Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'producers/pipeline/**'
      - '.github/workflows/pipeline-producer-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor (pub runs Debian 12's 3.11); 3.12 is current.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (Python ${{ matrix.python }})
        working-directory: producers/pipeline
        run: python3 -m unittest discover -s tests
