# ============================================================================
# Focus producer unit tests
# ============================================================================
# Runs the stdlib-only unit suite for producers/focus (#28). The suite drives
# a fake GitHub transport and temp directories, so it needs no tokens and no
# network.
#
# Path-filtered to producers/focus/** to stay cheap, so this must NOT be made
# a required status check: a required check whose workflow never triggers on
# a given PR is held "Expected" forever, deadlocking that PR. Leave it
# informational.
# ============================================================================

name: Focus Producer Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'producers/focus/**'
      - '.github/workflows/focus-producer-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (pub and LXC 118 run Debian 12's 3.11); 3.12 is current.
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (Python ${{ matrix.python }})
        working-directory: producers/focus
        run: python3 -m unittest discover -s tests
