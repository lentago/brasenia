<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>brasenia cast receiver</title>
  <!-- Cast Application ID (Cast Developer Console → Custom Receiver): PLACEHOLDER-REGISTER-IN-DEV-CONSOLE
       Not a secret; see cast-app/README.md for registration steps and cast-app/app-config.json
       for where the real value lands once issued. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #pane, #status-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #pane {
      border: 0;
      background: #000;
    }

    #status-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
    }

    #status-card[hidden] {
      display: none;
    }

    #status-card .title {
      font-size: 36px;
      margin-bottom: 16px;
    }

    #status-card .message {
      font-size: 22px;
      color: #999;
    }
  </style>
</head>
<body>
  <iframe id="pane" title="current pane" allow=""></iframe>

  <div id="status-card" hidden>
    <div class="title">brasenia</div>
    <div class="message"></div>
  </div>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="receiver.js"></script>
</body>
</html>
